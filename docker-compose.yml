services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-podcast_checker}:${POSTGRES_PASSWORD:-podcast_checker}@postgres:5432/${POSTGRES_DB:-podcast_checker}
      HOST: 0.0.0.0
      PORT: 3000
      PODCAST_WORKER_ENABLED: 'true'
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/signin').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podcast_checker}
      POSTGRES_USER: ${POSTGRES_USER:-podcast_checker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podcast_checker}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - ./drizzle:/drizzle:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres18_data:
