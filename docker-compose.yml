services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podcast_checker}
      POSTGRES_USER: ${POSTGRES_USER:-podcast_checker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podcast_checker}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - ./drizzle:/drizzle:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres18_data:
